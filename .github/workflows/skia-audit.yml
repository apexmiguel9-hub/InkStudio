name: skia-audit

# Real Skia build audit for Android arm64 on the GitHub Actions runner.
# Goal: answer with REAL logs/artifacts (not estimates):
#   1. does `fetch/git-sync-deps` + `gn gen` + `ninja` work for Android on
#      this CI at all? how long does each step take (timestamps)?
#   2. how much disk does the checkout + build need?
#   3. how many real build errors, pasted verbatim?
#   4. what does libskia.a weigh?
#
# Trigger: workflow_dispatch or push to alpha-skia-experiment.

on:
  workflow_dispatch:
  push:
    branches:
      - alpha-skia-experiment

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Environment snapshot
        run: |
          echo "== runner arch/mem/disk (before) =="
          nproc
          free -h | head -2
          df -h "$HOME" | tail -1
          echo "== SDK/NDK =="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME"/ndk 2>/dev/null || echo "no NDK under ANDROID_HOME"
          which clang clang++ ninja python3 git || true
          clang --version | head -1 || true
          python3 --version
          git --version
          echo "== type -a (what shadows what on default PATH) =="
          type -a ninja python3 gn gclient 2>&1 | head -20 || true

      - name: Install prerequisites (clang, ninja)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld ninja-build python3 ca-certificates
          # NOTE: do NOT put depot_tools on $GITHUB_PATH. Its un-bootstrapped
          # ninja/python3 wrappers broke runs 2 (36343861482) and 3 (36344313788):
          #   python3_bin_reldir.txt not found. need to initialize depot_tools ...
          # Skia needs no depot_tools: tools/git-sync-deps ends with bin/fetch-gn
          # (downloads skia/bin/gn), ninja comes from apt.
          /usr/bin/ninja --version

      - name: Set up JDK 17 (javac/d8/apksigner/keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout Skia (github mirror) + sync deps
        run: |
          set -euo pipefail
          T0=$(date +%s)
          mkdir -p "$HOME/skia"
          cd "$HOME/skia"
          time git clone --depth 1 https://github.com/google/skia.git .
          git log -1 --format='skia commit=%H date=%cI'
          du -sh .
          T1=$(date +%s)
          echo "CHECKOUT_SECONDS=$((T1 - T0))"
          echo "CHECKOUT_SECONDS=$((T1 - T0))" >> "$GITHUB_ENV"
          # deps sync -- run 1 (36343701468) died with a real shallow-clone race:
          #   fatal: update_ref failed for ref 'HEAD': trying to write ref 'HEAD'
          #          with nonexistent object 5a74ad24a3fbcfb86060497ead4d109520301e2e
          # (60+ concurrent shallow clones; git-sync-deps has no -j flag).
          # Retry with --deep (official full-checkout mode) + skip emsdk.
          GIT_SYNC_DEPS_SKIP_EMSDK=1 python3 tools/git-sync-deps --deep
          T2=$(date +%s)
          echo "DEPS_SYNC_SECONDS=$((T2 - T1))"
          echo "DEPS_SYNC_SECONDS=$((T2 - T1))" >> "$GITHUB_ENV"
          du -sh .
          ls third_party/externals 2>/dev/null | head -40 || echo "no externals dir"

      - name: gn gen (android arm64)
        id: gn-gen
        run: |
          set -euo pipefail
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          echo "NDK=$NDK"
          [ -n "$NDK" ] || { echo "FATAL: no NDK found"; exit 1; }
          cd "$HOME/skia"
          # skia's bin/gn is the binary fetched by tools/git-sync-deps (bin/fetch-gn).
          ls -la bin/gn
          ./bin/gn --version
          T0=$(date +%s)
          bin/gn gen out/android-arm64 --args='
            target_os="android"
            target_cpu="arm64"
            is_debug=false
            is_official_build=false
            ndk="'"$NDK"'"
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libpng=false
            skia_use_system_libwebp=false
            skia_use_system_zlib=false
            skia_use_system_expat=false
            skia_use_system_freetype2=false
            skia_use_system_harfbuzz=false
            skia_use_system_icu=false
            skia_use_fontconfig=false
            skia_use_vulkan=false
            skia_enable_skshaper=false
            skia_enable_skottie=false
            skia_enable_pdf=false
            skia_enable_tools=false
          ' > /tmp/gn-gen.log 2>&1
          T1=$(date +%s)
          echo "GN_GEN_SECONDS=$((T1 - T0))"
          echo "GN_GEN_SECONDS=$((T1 - T0))" >> "$GITHUB_ENV"
          echo "== gn gen OK - args baked: =="
          cat out/android-arm64/args.gn

      - name: ninja build libskia.a
        id: ninja
        run: |
          set -euo pipefail
          cd "$HOME/skia"
          # Run 2 (36343861482) died here with a WORKFLOW bug, not a Skia one:
          #   python3_bin_reldir.txt not found. need to initialize depot_tools ...
          # depot_tools was on PATH and its un-bootstrapped ninja wrapper won.
          # We don't need depot_tools at all (fetch-gn gives us skia/bin/gn;
          # ninja comes from apt). Use system binaries explicitly.
          echo "ninja: $(command -v ninja)"
          /usr/bin/ninja --version
          T0=$(date +%s)
          # tee the whole log so we can paste real errors verbatim
          /usr/bin/ninja -C out/android-arm64 skia 2>&1 | tee /tmp/ninja-skia.log | tail -80
          RC=${PIPESTATUS[0]}
          T1=$(date +%s)
          echo "NINJA_SECONDS=$((T1 - T0))"
          echo "NINJA_SECONDS=$((T1 - T0))" >> "$GITHUB_ENV"
          if [ "$RC" -ne 0 ]; then
            echo "NINJA_FAILED=1" >> "$GITHUB_ENV"
            echo "ninja exit $RC; see artifact log"
            grep -nE "error:|FAILED:" /tmp/ninja-skia.log | head -40 || true
            exit 1
          fi
          echo "== build OK =="
          ls -lh out/android-arm64/*.a out/android-arm64/*.so 2>/dev/null || true
          du -sh out/android-arm64
          df -h "$HOME" | tail -1

      - name: Link skia into shared lib (JNI stub) + real sizes
        id: link-so
        run: |
          set -euo pipefail
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          TRIPLE="aarch64-linux-android"
          cd "$HOME/skia"
          mkdir -p jni
          cat > jni/skia_jni.cpp <<'EOF'
          #include <jni.h>
          #include "include/core/SkGraphics.h"
          #include "include/core/SkMilestone.h"
          #define STR_(x) #x
          #define STR(x) STR_(x)
          extern "C" JNIEXPORT jstring JNICALL
          Java_org_inkscape_skia_SkiaNative_version(JNIEnv *env, jobject) {
              SkGraphics::Init();  // real API call — proves linking works
              return env->NewStringUTF("skia milestone " STR(SK_MILESTONE));
          }
          EOF
          # All static libs except the x86-only libwebp_sse41 variant.
          STATICS="$(ls out/android-arm64/lib*.a | grep -v sse41 | tr '\n' ' ')"
          echo "== linking with: =="
          echo "$STATICS"
          "$TC/bin/${TRIPLE}35-clang++" -std=c++17 -fPIC -shared \
            -I . -I include \
            jni/skia_jni.cpp $STATICS \
            -lEGL -lGLESv2 -landroid -llog -lc++_static \
            -Wl,--gc-sections \
            -o out/android-arm64/libskiaexperiment.so
          echo "== UNSTRIPPED =="
          ls -lh out/android-arm64/libskiaexperiment.so
          stat -c%s out/android-arm64/libskiaexperiment.so | awk '{printf "bytes=%d (%.2f MB)\n", $1, $1/1048576}'
          "$TC/bin/llvm-strip" --strip-unneeded out/android-arm64/libskiaexperiment.so \
            -o out/android-arm64/libskiaexperiment.stripped.so
          echo "== STRIPPED =="
          ls -lh out/android-arm64/libskiaexperiment.stripped.so
          stat -c%s out/android-arm64/libskiaexperiment.stripped.so | awk '{printf "bytes=%d (%.2f MB)\n", $1, $1/1048576}'
          # sanity: does the archive hold the JNI symbol?
          "$TC/bin/llvm-nm" -D out/android-arm64/libskiaexperiment.so | grep Java_org_inkscape_skia || true

      - name: Build Skia experiment APK (JNI + Ganesh GL canvas)
        id: app
        run: |
          set -euo pipefail
          export SKIA_DIR="$HOME/skia"
          bash skia-experiment/scripts/build_skia_app.sh
          cp skia-experiment/build/skia-exp-debug.apk /tmp/skia-exp-debug.apk
          ls -la /tmp/skia-exp-debug.apk

      - name: Summarize measurements
        if: always()
        run: |
          echo "== real timings =="
          echo "checkout+deps: ${CHECKOUT_SECONDS:-?}s checkout, ${DEPS_SYNC_SECONDS:-?}s deps"
          echo "gn gen: ${GN_GEN_SECONDS:-?}s"
          echo "ninja: ${NINJA_SECONDS:-?}s (libskia.a)"
          echo "ninja failed: ${NINJA_FAILED:-no}"
          echo "== disk after =="
          df -h "$HOME" | tail -1
          du -sh "$HOME/skia" 2>/dev/null || true

      - name: Upload build logs + artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skia-audit-output
          path: |
            /tmp/gn-gen.log
            /tmp/ninja-skia.log
            /tmp/skia-exp-debug.apk
            /home/runner/skia/out/android-arm64/*.a
            /home/runner/skia/out/android-arm64/libskia*.so
          if-no-files-found: warn