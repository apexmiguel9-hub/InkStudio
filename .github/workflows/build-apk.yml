name: build-apk

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'release | debug'
        required: false
        default: 'release'

  workflow_run:
    workflows: ["build-inkscape"]
    types: [completed]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repo (android/ + .github/)
      # ---------------------------------------------------------
      - name: Checkout InkStudio
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Descargar .so nativas del último build-inkscape exitoso
      # ---------------------------------------------------------
      - name: Resolve source run ID
        id: resolve-run
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.source_run_id }}" ]; then
            echo "source_run_id=${{ inputs.source_run_id }}" >> "$GITHUB_OUTPUT"
          else
            RUN_ID=$(gh api repos/apexmiguel9-hub/InkStudio/actions/runs \
              --jq '.workflow_runs[] | select(.name=="build-inkscape" and .conclusion=="success" and .head_branch=="main") | .id' \
              | head -1)
            [ -z "$RUN_ID" ] && { echo "ERROR: no hay build-inkscape exitoso"; exit 1; }
            echo "source_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download native libs artifact
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.resolve-run.outputs.source_run_id }}"
          DEST="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          ARTIFACT_ID=$(gh api repos/apexmiguel9-hub/InkStudio/actions/runs/$RUN_ID/artifacts \
            --jq '.artifacts[] | select(.name=="inkscape-android-arm64-binaries") | .id')
          [ -z "$ARTIFACT_ID" ] && { echo "ERROR: artifact no encontrado"; exit 1; }
          gh api repos/apexmiguel9-hub/InkStudio/actions/artifacts/$ARTIFACT_ID/zip \
            > "$RUNNER_TEMP/inkscape-libs.zip"
          unzip -o "$RUNNER_TEMP/inkscape-libs.zip" -d "$DEST"
          echo "Libs propias descargadas:"
          ls -la "$DEST/"
        env:
          GH_TOKEN: ${{ github.token }}

      # ---------------------------------------------------------
      # 3. Clonar dependencias + copiar .so Y headers (ROBUSTO)
      # ---------------------------------------------------------
      - name: Clone dependency libs & copy .so + headers
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          DEST="$ROOT/android/app/src/main/jniLibs/arm64-v8a"
          INCLUDE_DEST="$ROOT/android/app/src/main/cpp/include"
          mkdir -p "$DEST" "$INCLUDE_DEST"

          # 1. Nuestras libs (tier1+tier2)
          echo "=== Clonando lib-inkscape-android_arm64 ==="
          git clone --depth 1 https://github.com/apexmiguel9-hub/lib-inkscape-android_arm64.git /tmp/our-libs
          find /tmp/our-libs -type f \( -name "*.so" -o -name "*.so.*" \) \
            ! -path "*/python/*" ! -path "*/site-packages/*" \
            -exec cp -v {} "$DEST/" \; 2>/dev/null || true
          find /tmp/our-libs -type d -name "include" -print0 2>/dev/null | while IFS= read -r -d '' inc; do
            cp -rv "$inc/"* "$INCLUDE_DEST/" 2>/dev/null || true
          done

          # 2. Blender libs (subset LFS)
          echo "=== Clonando blender lib-android_arm64 ==="
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://projects.blender.org/blender/lib-android_arm64.git /tmp/blender-libs
          cd /tmp/blender-libs
          git lfs pull -I "zlib/**,png/**,jpeg/**,webp/**,openjpeg/**,freetype/**,harfbuzz/**,fribidi/**,xml2/**,epoxy/**,potrace/**,zstd/**,brotli/**"
          find /tmp/blender-libs -type f \( -name "*.so" -o -name "*.so.*" \) \
            -path "*/lib/*" ! -path "*/python/*" ! -path "*/site-packages/*" ! -path "*/cmake/*" \
            -exec cp -v {} "$DEST/" \; 2>/dev/null || true
          find /tmp/blender-libs -type d -name "include" -print0 2>/dev/null | while IFS= read -r -d '' inc; do
            cp -rv "$inc/"* "$INCLUDE_DEST/" 2>/dev/null || true
          done

          echo "=== Total en jniLibs ==="
          ls -la "$DEST/" | wc -l
          echo "=== Headers copiados a $INCLUDE_DEST ==="
          ls -la "$INCLUDE_DEST/" 2>/dev/null | head -20 || true
        env:
          GH_TOKEN: ${{ github.token }}

      # ---------------------------------------------------------
      # 4. Verificar libs críticas
      # ---------------------------------------------------------
      - name: Verify native libs
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          for lib in libinkscape.so libinkview.so libinkscape_base.so libgtk-4.so; do
            [ -f "$DEST/$lib" ] || { echo "ERROR: falta $lib"; exit 1; }
          done
          echo "OK: libs críticas presentes"

      # ---------------------------------------------------------
      # 5. JDK 17
      # ---------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ---------------------------------------------------------
      # 6. NDK r30 OFICIAL + CONFIG GRADLE EXPLÍCITO
      # ---------------------------------------------------------
      - name: Setup Android SDK + NDK r30
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH

          # Platforms & build-tools
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

          # -----------------------------------------------------
          # NDK r30 OFICIAL: zip Google (TIENE source.properties)
          # -----------------------------------------------------
          NDK_VER="r30"
          NDK_DIR="$HOME/android-ndk-$NDK_VER"
          CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          if ! test -x "$CLANG"; then
            echo "Descargando android-ndk-$NDK_VER-linux.zip ..."
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-$NDK_VER-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi

          test -x "$CLANG" || { echo "ERROR: clang no ejecutable"; exit 1; }
          test -f "$NDK_DIR/source.properties" || { echo "ERROR: NDK sin source.properties"; exit 1; }

          echo "NDK r30 verificado: $NDK_DIR"
          "$CLANG" --version | head -1

          # -----------------------------------------------------
          # VARIABLES DE ENTORNO PARA GRADLE/CMAKE
          # -----------------------------------------------------
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          # -----------------------------------------------------
          # ESCRIBIR local.properties EXPLÍCITO
          # -----------------------------------------------------
          echo "ndk.dir=$NDK_DIR" > "$GITHUB_WORKSPACE/android/local.properties"
          echo "sdk.dir=$ANDROID_HOME" >> "$GITHUB_WORKSPACE/android/local.properties"
          cat "$GITHUB_WORKSPACE/android/local.properties"

      # ---------------------------------------------------------
      # 7. Cache Gradle
      # ---------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-

      # ---------------------------------------------------------
      # 8. Permisos gradlew
      # ---------------------------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ---------------------------------------------------------
      # 8. BUILD: clean + assembleRelease
      # ---------------------------------------------------------
      - name: Build APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      # ---------------------------------------------------------
      # 9. Verificar + Subir APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "ERROR: APK no generado"; exit 1; }
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" | grep -E '\.so$' | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkstudio-release-arm64-v8a.apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkstudio-release-arm64-v8a.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
