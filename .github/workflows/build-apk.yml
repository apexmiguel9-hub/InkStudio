name: build-apk

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref del build-inkscape (para descargar artifact correcto)'
        required: false
        default: 'master'
      variant:
        description: 'release | debug'
        required: false
        default: 'release'

  # También se puede disparar automáticamente cuando build-inkscape termina OK
  workflow_run:
    workflows: ["build-inkscape"]
    types: [completed]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout InkStudio (para gradle + android/)
        uses: actions/checkout@v4

      # Descargar .so del build-inkscape exitoso más reciente
      - name: Download native libs artifact
        uses: actions/download-artifact@v4
        with:
          name: inkscape-android-arm64-binaries
          path: android/app/src/main/jniLibs/arm64-v8a/
          # Si se lanzó manualmente, buscar el run específico; si es workflow_run, usa el que lo disparó
          # GitHub Actions resuelve automáticamente el artifact del run que disparó

      # Verificar que bajaron los .so
      - name: Verify native libs
        run: |
          set -euo pipefail
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          echo "=== Tamaños ==="
          for f in android/app/src/main/jniLibs/arm64-v8a/*.so; do
            [ -f "$f" ] && echo "$(basename "$f"): $(stat -c%s "$f") bytes"
          done
          # Libs críticas obligatorias
          for lib in libinkscape.so libinkview.so libinkscape_base.so libgtk-4.so libcairo.so libpango-1.0.so libglib-2.0.so; do
            [ -f "android/app/src/main/jniLibs/arm64-v8a/$lib" ] || { echo "ERROR: falta $lib"; exit 1; }
          done
          echo "OK: libs críticas presentes"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26d
          cmdline-tools-version: latest

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assemble${{ inputs.variant == 'debug' && 'Debug' || 'Release' }} --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/${{ inputs.variant == 'debug' && 'debug' || 'release' }}/app-${{ inputs.variant == 'debug' && 'debug' || 'release' }}.apk"
          [ -f "$APK" ] || { echo "ERROR: APK no generado"; exit 1; }
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          # Verificar que incluye libs nativas
          unzip -l "$APK" | grep -E '\.so$' | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkstudio-${{ inputs.variant }}-arm64-v8a.apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload AAB artifact (si release)
        if: inputs.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: inkstudio-release-arm64-v8a.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Opcional: crear release en GitHub con el APK
      - name: Create Release (si tag)
        if: github.event.workflow_dispatch && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true