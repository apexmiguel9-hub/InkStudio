name: build-apk

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'release | debug'
        required: false
        default: 'release'

  workflow_run:
    workflows: ["build-inkscape"]
    types: [completed]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repo (android/ + .github/)
      # ---------------------------------------------------------
      - name: Checkout InkStudio
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Descargar .so nativas del último build-inkscape exitoso
      # ---------------------------------------------------------
      - name: Resolve source run ID
        id: resolve-run
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.source_run_id }}" ]; then
            echo "source_run_id=${{ inputs.source_run_id }}" >> "$GITHUB_OUTPUT"
          else
            # Paginate through all pages to find the latest successful build-inkscape
            RUN_ID=""
            PAGE=1
            while [ -z "$RUN_ID" ]; do
              RESPONSE=$(gh api "repos/apexmiguel9-hub/InkStudio/actions/runs?per_page=100&page=$PAGE" --jq '.workflow_runs[] | select(.name=="build-inkscape" and .conclusion=="success" and .head_branch=="main") | .id' 2>/dev/null)
              if [ -n "$RESPONSE" ]; then
                RUN_ID=$(echo "$RESPONSE" | head -1)
                break
              fi
              # Check if there are more pages
              TOTAL=$(gh api "repos/apexmiguel9-hub/InkStudio/actions/runs?per_page=100&page=$PAGE" --jq '.total_count' 2>/dev/null)
              [ "$TOTAL" -le $((PAGE * 100)) ] && break
              PAGE=$((PAGE + 1))
            done
            [ -z "$RUN_ID" ] && { echo "ERROR: no hay build-inkscape exitoso"; exit 1; }
            echo "source_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download native libs artifact
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.resolve-run.outputs.source_run_id }}"
          DEST="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          ARTIFACT_ID=$(gh api repos/apexmiguel9-hub/InkStudio/actions/runs/$RUN_ID/artifacts \
            --jq '.artifacts[] | select(.name=="inkscape-android-arm64-binaries") | .id')
          [ -z "$ARTIFACT_ID" ] && { echo "ERROR: artifact no encontrado"; exit 1; }
          gh api repos/apexmiguel9-hub/InkStudio/actions/artifacts/$ARTIFACT_ID/zip \
            > "$RUNNER_TEMP/inkscape-libs.zip"
          unzip -o "$RUNNER_TEMP/inkscape-libs.zip" -d "$DEST"
          echo "Libs propias descargadas:"
          ls -la "$DEST/"
        env:
          GH_TOKEN: ${{ github.token }}

      # ---------------------------------------------------------
      # 3. Clonar dependencias + copiar .so Y headers (ROBUSTO)
      # ---------------------------------------------------------
      - name: Clone dependency libs & copy .so + headers
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          DEST="$ROOT/android/app/src/main/jniLibs/arm64-v8a"
          INCLUDE_DEST="$ROOT/android/app/src/main/cpp/include"
          mkdir -p "$DEST" "$INCLUDE_DEST"

          # 1. Nuestras libs (tier1+tier2)
          echo "=== Clonando lib-inkscape-android_arm64 ==="
          git clone --depth 1 https://github.com/apexmiguel9-hub/lib-inkscape-android_arm64.git /tmp/our-libs
          find /tmp/our-libs -type f \( -name "*.so" -o -name "*.so.*" \) \
            ! -path "*/python/*" ! -path "*/site-packages/*" \
            -size +1k \
            -exec cp -v {} "$DEST/" \; 2>/dev/null || true

          # ICU: el binario real es libicudata.so.75.1 (30MB); .so y .so.75
          # son symlinks. CLAVE: AGP SOLO empaqueta en el APK los nombres
          # que terminan en ".so" -> cualquier ".so.75" se DESCARTA del APK
          # y el DT_NEEDED "libicudata.so.75" queda sin resolver (crash:
          # UnsatisfiedLinkError en nativeInit). Por eso:
          #   1) materializar SOLO libicudata.so (nombre empaquetable)
          #   2) patchelf: reescribir DT_NEEDED .so.75 -> .so en las 3 libs
          #      que lo piden + normalizar SONAME de la propia lib
          if [ -f /tmp/our-libs/icu/lib/libicudata.so.75.1 ]; then
            cp -L /tmp/our-libs/icu/lib/libicudata.so.75.1 "$DEST/libicudata.so"
            rm -f "$DEST/libicudata.so.75" "$DEST/libicudata.so.75.1"
            echo "ICU: libicudata.so materializado (versionados descartados):"
            ls -la "$DEST"/libicudata.so*
          else
            echo "WARN: icu/lib/libicudata.so.75.1 no presente en our-libs"
          fi

          if ! command -v patchelf >/dev/null 2>&1; then
            sudo apt-get install -y patchelf >/dev/null 2>&1 || \
              { sudo apt-get update -qq && sudo apt-get install -y patchelf; }
          fi
          command -v patchelf >/dev/null 2>&1 || { echo "ERROR: patchelf no disponible"; exit 1; }
          for lib in libinkscape_base.so libinkscape.so libinkview.so; do
            [ -f "$DEST/$lib" ] || continue
            if readelf -d "$DEST/$lib" | grep -q 'libicudata\.so\.75'; then
              patchelf --replace-needed libicudata.so.75 libicudata.so "$DEST/$lib"
              echo "patchelf: $lib DT_NEEDED libicudata.so.75 -> libicudata.so"
            fi
          done
          if [ -f "$DEST/libicudata.so" ]; then
            patchelf --set-soname libicudata.so "$DEST/libicudata.so"
            echo "patchelf: libicudata.so SONAME -> libicudata.so"
          fi
          find /tmp/our-libs -type d -name "include" ! -path "*/llvm/*" ! -path "*/clang/*" -print0 2>/dev/null | while IFS= read -r -d '' inc; do
            cp -rv "$inc/"* "$INCLUDE_DEST/" 2>/dev/null || true
          done

          # 2. Blender libs (subset LFS)
          echo "=== Clonando blender lib-android_arm64 ==="
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://projects.blender.org/blender/lib-android_arm64.git /tmp/blender-libs
          cd /tmp/blender-libs
          git lfs pull -I "zlib/**,png/**,jpeg/**,webp/**,openjpeg/**,freetype/**,harfbuzz/**,fribidi/**,xml2/**,epoxy/**,potrace/**,zstd/**,brotli/**"
          find /tmp/blender-libs -type f \( -name "*.so" -o -name "*.so.*" \) \
            -path "*/lib/*" ! -path "*/python/*" ! -path "*/site-packages/*" ! -path "*/cmake/*" \
            -size +1k \
            -exec cp -v {} "$DEST/" \; 2>/dev/null || true
          find /tmp/blender-libs -type d -name "include" ! -path "*/llvm/*" ! -path "*/clang/*" -print0 2>/dev/null | while IFS= read -r -d '' inc; do
            cp -rv "$inc/"* "$INCLUDE_DEST/" 2>/dev/null || true
          done

          # Mover headers de clang que queden fuera del árbol (stdint.h etc. del NDK deben ganar)
          echo "=== Limpiando headers estandar falsos (clang/llvm) ==="
          rm -f "$INCLUDE_DEST"/stdint.h "$INCLUDE_DEST"/stdarg.h "$INCLUDE_DEST"/stddef.h \
                "$INCLUDE_DEST"/stdbool.h "$INCLUDE_DEST"/limits.h "$INCLUDE_DEST"/float.h \
                "$INCLUDE_DEST"/stdatomic.h "$INCLUDE_DEST"/stdalign.h 2>/dev/null || true

          echo "=== Limpiando .so stub (archivos < 1KB no son libs reales, ej. LFS pointers 130B) ==="
          find "$DEST" -type f -name "*.so*" -size -1k -delete -print 2>/dev/null | wc -l
          echo "stubs eliminados (ver arriba)"

          echo "=== Total en jniLibs ==="
          ls -la "$DEST/" | wc -l
          echo "=== Headers copiados a $INCLUDE_DEST ==="
          ls -la "$INCLUDE_DEST/" 2>/dev/null | head -20 || true
        env:
          GH_TOKEN: ${{ github.token }}

      # ---------------------------------------------------------
      # 4. Verificar libs críticas
      # ---------------------------------------------------------
      - name: Verify native libs
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          # DT_NEEDED completo de libinkscape_base.so que NO es system lib:
          for lib in libinkscape.so libinkview.so libinkscape_base.so libgtk-4.so \
                     lib2geom.so libicudata.so; do
            [ -f "$DEST/$lib" ] || { echo "ERROR: falta $lib (DT_NEEDED no resuelto -> crash en runtime)"; exit 1; }
            size=$(stat -c%s "$DEST/$lib")
            [ "$size" -gt 1024 ] || { echo "ERROR: $lib es stub ($size bytes), no una lib real"; exit 1; }
          done
          # Ninguna lib puede pedir un ".so.N" versionado: AGP no lo
          # empaqueta (bug ya visto con libicudata.so.75 -> APK lo omitia)
          BAD=$(for lib in "$DEST"/*.so; do
                  readelf -d "$lib" 2>/dev/null | grep NEEDED | grep -oE '\[[^]]+\]'
                done | grep -E '\.so\.[0-9]' || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: DT_NEEDED con nombre versionado (AGP lo descarta del APK):"
            echo "$BAD"
            exit 1
          fi
          echo "OK: libs criticas presentes + DT_NEEDED sin nombres versionados"
          ls -la "$DEST"

      # ---------------------------------------------------------
      # 4b. Reordenar .init_array de libinkscape_base.so (fix SIOF)
      #     Los ctors estaticos de glibmm/gtkmm deben ejecutarse ANTES
      #     que los de Inkscape (si no -> SIGSEGV en dlopen: ModelColumns
      #     usa los std::map de value_custom.cc sin construir). El script
      #     hace stable-partition in-place sobre el .init_array.
      # ---------------------------------------------------------
      - name: Reorder .init_array libinkscape_base.so (fix SIOF)
        run: |
          set -euo pipefail
          if ! command -v aarch64-linux-gnu-objdump >/dev/null 2>&1; then
            sudo apt-get install -y binutils-aarch64-linux-gnu >/dev/null 2>&1 || \
              { sudo apt-get update -qq && sudo apt-get install -y binutils-aarch64-linux-gnu; }
          fi
          command -v aarch64-linux-gnu-objdump >/dev/null 2>&1 || { echo "ERROR: objdump aarch64 no disponible"; exit 1; }
          DEST="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          python3 "$GITHUB_WORKSPACE/android/scripts/reorder_init_array.py" \
            "$DEST/libinkscape_base.so" /usr/bin/aarch64-linux-gnu-objdump
          echo "=== .init_array reordenado OK (ver FRONT/LATE + anclas arriba) ==="

      # ---------------------------------------------------------
      # 5. JDK 17
      # ---------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ---------------------------------------------------------
      # 5b. KEYSTORE RELEASE: restaurar (firma estable) o generar con keytool
      # ---------------------------------------------------------
      - name: Restore or generate release keystore
        run: |
          set -euo pipefail
          KEYDIR="$GITHUB_WORKSPACE/android/app/keystore"
          KEYSTORE="$KEYDIR/inkscape-release.jks"
          PASS="inkscape2026"
          ALIAS="inkscape"
          mkdir -p "$KEYDIR"

          RESTORED=0
          # Intentar restaurar la misma firma del ultimo build (para que
          # actualizaciones sobre APKs previos no fallen por cambio de key)
          # Usamos curl con reintentos y timeout para evitar SIGPIPE (exit 141)
          for attempt in 1 2 3; do
            ARTIFACT_ID=$(gh api "repos/apexmiguel9-hub/InkStudio/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name=="inkstudio-release-keystore" and .expired==false) | .id' 2>/dev/null | head -1)
            if [ -n "$ARTIFACT_ID" ]; then
              echo "KEYSIGN: intentando restaurar keystore del artifact $ARTIFACT_ID (intento $attempt/3)"
              # Usar curl con timeout y reintentos en lugar de gh api (evita SIGPIPE)
              if curl -fsSL --retry 3 --retry-delay 2 --max-time 30 \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/apexmiguel9-hub/InkStudio/actions/artifacts/${ARTIFACT_ID}/zip" \
                  -o "$RUNNER_TEMP/key.zip"; then
                unzip -o "$RUNNER_TEMP/key.zip" -d "$KEYDIR" >/dev/null 2>&1 || true
                if [ -f "$KEYSTORE" ]; then
                  RESTORED=1
                  echo "KEYSIGN: keystore RESTAURADO (firma estable)"
                  break
                fi
              fi
              echo "KEYSIGN: intento $attempt falló, reintentando en 10s..."
              sleep 10
            else
              echo "KEYSIGN: no se encontró artifact de keystore"
              break
            fi
          done

          if [ "$RESTORED" -eq 0 ]; then
            echo "KEYSIGN: generando nuevo keystore release con keytool (fallback)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Inkscape Android, OU=InkStudio, O=InkStudio, L=Mobile, C=US" \
              2>&1 | tail -2
          fi

          test -f "$KEYSTORE" || { echo "ERROR: keystore no existe"; exit 1; }
          echo "KEYSIGN: keystore listo -> $KEYSTORE"
          ls -la "$KEYSTORE"

          # Variables para gradle (ruta absoluta -> evita bugs de checkout relativo)
          echo "INKSIGN_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "INKSIGN_PASS=$PASS" >> "$GITHUB_ENV"
          echo "INKSIGN_ALIAS=$ALIAS" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      # ---------------------------------------------------------
      # 6. NDK r30 OFICIAL + CONFIG GRADLE EXPLÍCITO
      # ---------------------------------------------------------
      - name: Setup Android SDK + NDK r30
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH

          # Platforms & build-tools
          echo y | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

          # -----------------------------------------------------
          # NDK r30 OFICIAL: zip Google (TIENE source.properties)
          # -----------------------------------------------------
          NDK_VER="r30"
          NDK_DIR="$HOME/android-ndk-$NDK_VER"
          CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          if ! test -x "$CLANG"; then
            echo "Descargando android-ndk-$NDK_VER-linux.zip ..."
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-$NDK_VER-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi

          test -x "$CLANG" || { echo "ERROR: clang no ejecutable"; exit 1; }
          test -f "$NDK_DIR/source.properties" || { echo "ERROR: NDK sin source.properties"; exit 1; }

          echo "NDK r30 verificado: $NDK_DIR"
          "$CLANG" --version | head -1

          # -----------------------------------------------------
          # VARIABLES DE ENTORNO PARA GRADLE/CMAKE
          # -----------------------------------------------------
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          # -----------------------------------------------------
          # ESCRIBIR local.properties EXPLÍCITO
          # -----------------------------------------------------
          echo "ndk.dir=$NDK_DIR" > "$GITHUB_WORKSPACE/android/local.properties"
          echo "sdk.dir=$ANDROID_HOME" >> "$GITHUB_WORKSPACE/android/local.properties"
          cat "$GITHUB_WORKSPACE/android/local.properties"

      # ---------------------------------------------------------
      # 7. Cache Gradle
      # ---------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-

      # ---------------------------------------------------------
      # 8. Permisos gradlew
      # ---------------------------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ---------------------------------------------------------
      # 8. BUILD: assembleRelease (sin clean para evitar problemas de formato)
      # ---------------------------------------------------------
      - name: Build APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          INKSIGN_KEYSTORE: ${{ env.INKSIGN_KEYSTORE }}
          INKSIGN_PASS: ${{ env.INKSIGN_PASS }}
          INKSIGN_ALIAS: ${{ env.INKSIGN_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ---------------------------------------------------------
      # 9. Verificar + Subir APK (busca en todas las ubicaciones posibles)
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          echo "=== Buscando APK generado ==="
          APK=$(find android/app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "APK no encontrado, listando outputs:"
            find android/app/build/outputs -type f 2>/dev/null | head -30
            echo "ERROR: APK no generado"
            exit 1
          fi
          echo "APK encontrado: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" | grep -E '\.so$' | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkstudio-release-arm64-v8a.apk
          path: android/app/build/outputs/**/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkstudio-release-arm64-v8a.aab
          path: android/app/build/outputs/**/*.aab
          retention-days: 30

      # ---------------------------------------------------------
      # 10. Persistir keystore release (firma estable entre builds)
      # ---------------------------------------------------------
      - name: Upload release keystore
        uses: actions/upload-artifact@v4
        with:
          name: inkstudio-release-keystore
          path: android/app/keystore/inkscape-release.jks
          retention-days: 30
