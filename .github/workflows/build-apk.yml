name: build-apk

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref del build-inkscape (para descargar artifact correcto)'
        required: false
        default: 'master'
      variant:
        description: 'release | debug'
        required: false
        default: 'release'
      source_run_id:
        description: 'Run ID de build-inkscape exitoso (opcional, auto-detecta el último)'
        required: false
        default: ''

  # También se puede disparar automáticamente cuando build-inkscape termina OK
  workflow_run:
    workflows: ["build-inkscape"]
    types: [completed]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout InkStudio (para gradle + android/)
        uses: actions/checkout@v4

      # Determinar run ID de build-inkscape del que bajar .so
      - name: Resolve source run ID
        id: resolve-run
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.source_run_id }}" ]; then
            echo "source_run_id=${{ inputs.source_run_id }}" >> "$GITHUB_OUTPUT"
            echo "Usando run ID manual: ${{ inputs.source_run_id }}"
          else
            # Auto-detectar: último build-inkscape exitoso en main
            RUN_ID=$(gh api repos/apexmiguel9-hub/InkStudio/actions/runs \
              --jq '.workflow_runs[] | select(.name=="build-inkscape" and .conclusion=="success" and .head_branch=="main") | .id' \
              | head -1)
            if [ -z "$RUN_ID" ]; then
              echo "ERROR: No se encontró build-inkscape exitoso reciente"
              exit 1
            fi
            echo "source_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "Auto-detectado build-inkscape run: $RUN_ID"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Descargar .so del build-inkscape exitoso usando gh CLI (más fiable cross-workflow)
      - name: Download native libs artifact (inkscape own libs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.resolve-run.outputs.source_run_id }}"
          ARTIFACT_NAME="inkscape-android-arm64-binaries"
          DEST="android/app/src/main/jniLibs/arm64-v8a"
          
          mkdir -p "$DEST"
          echo "Descargando artifact '$ARTIFACT_NAME' del run $RUN_ID..."
          
          # Obtener artifact ID
          ARTIFACT_ID=$(gh api repos/apexmiguel9-hub/InkStudio/actions/runs/$RUN_ID/artifacts \
            --jq ".artifacts[] | select(.name==\"$ARTIFACT_NAME\") | .id")
          
          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: No se encontró artifact '$ARTIFACT_NAME' en run $RUN_ID"
            exit 1
          fi
          
          echo "Artifact ID: $ARTIFACT_ID"
          
          # Descargar y extraer
          gh api repos/apexmiguel9-hub/InkStudio/actions/artifacts/$ARTIFACT_ID/zip \
            > "$RUNNER_TEMP/artifact.zip"
          
          unzip -o "$RUNNER_TEMP/artifact.zip" -d "$DEST"
          
          echo "=== libs propias descargadas ==="
          ls -la "$DEST/"

      # Clonar libs de dependencias (tier1+tier2 + Blender subset) y copiar TODAS las .so
      - name: Clone dependency libs & copy all .so
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST="android/app/src/main/jniLibs/arm64-v8a"
          
          # 1. Nuestras libs (tier1+tier2: GTK4, gtkmm, cairo, pango, glib, etc.)
          echo "=== Clonando lib-inkscape-android_arm64 (tier1+tier2) ==="
          git clone --depth 1 https://github.com/apexmiguel9-hub/lib-inkscape-android_arm64.git /tmp/our-libs
          find /tmp/our-libs -name "*.so" -o -name "*.so.*" | while read so; do
            cp -v "$so" "$DEST/"
          done
          
          # 2. Blender libs (subset LFS que ya usa build-inkscape)
          echo "=== Clonando blender lib-android_arm64 (subset LFS) ==="
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://projects.blender.org/blender/lib-android_arm64.git /tmp/blender-libs
          cd /tmp/blender-libs
          git lfs pull -I "zlib/**,png/**,jpeg/**,webp/**,openjpeg/**,freetype/**,harfbuzz/**,fribidi/**,xml2/**,epoxy/**,potrace/**,zstd/**,brotli/**"
          find /tmp/blender-libs -name "*.so" -o -name "*.so.*" | while read so; do
            cp -v "$so" "$DEST/"
          done
          
          echo "=== Total .so en jniLibs ==="
          ls -la "$DEST/" | wc -l
          echo "=== Verificación libs críticas ==="
          for lib in libinkscape.so libinkview.so libinkscape_base.so libgtk-4.so libcairo.so libpango-1.0.so libglib-2.0.so libgobject-2.0.so libgio-2.0.so libgmodule-2.0.so libfreetype.so libharfbuzz.so libfribidi.so libpixman-1.so libepoxy.so libgraphene-1.0.so libpng16.so libjpeg.so libxml2.so libz.so liblzma.so libzstd.so libbrotlidec.so libbrotlicommon.so libexpat.so libpcre2-8.so libffi.so libintl.so libiconv.so liblcms2.so; do
            [ -f "$DEST/$lib" ] && echo "  ✓ $lib" || echo "  ✗ $lib FALTA"
          done

      # Verificar que bajaron los .so
      - name: Verify native libs
        run: |
          set -euo pipefail
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          echo "=== Tamaños ==="
          for f in android/app/src/main/jniLibs/arm64-v8a/*.so; do
            [ -f "$f" ] && echo "$(basename "$f"): $(stat -c%s "$f") bytes"
          done
          # Libs críticas obligatorias
          for lib in libinkscape.so libinkview.so libinkscape_base.so libgtk-4.so libcairo.so libpango-1.0.so libglib-2.0.so; do
            [ -f "android/app/src/main/jniLibs/arm64-v8a/$lib" ] || { echo "ERROR: falta $lib"; exit 1; }
          done
          echo "OK: libs críticas presentes"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26d
          cmdline-tools-version: latest

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assemble${{ inputs.variant == 'debug' && 'Debug' || 'Release' }} --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/${{ inputs.variant == 'debug' && 'debug' || 'release' }}/app-${{ inputs.variant == 'debug' && 'debug' || 'release' }}.apk"
          [ -f "$APK" ] || { echo "ERROR: APK no generado"; exit 1; }
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          # Verificar que incluye libs nativas
          unzip -l "$APK" | grep -E '\.so$' | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkstudio-${{ inputs.variant }}-arm64-v8a.apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload AAB artifact (si release)
        if: inputs.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: inkstudio-release-arm64-v8a.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Opcional: crear release en GitHub con el APK
      - name: Create Release (si tag)
        if: github.event.workflow_dispatch && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true