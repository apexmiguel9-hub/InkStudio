name: build-inkalpha

# Builds the InkAlpha prototype APK — RIVE EXPERIMENT branch:
# Rive low-level Vulkan renderer (rive::Renderer + RenderPath over an
# ANativeWindow swapchain) + ported Inkscape rect/select tools.
# See prototype/README.md.
#
# Triggers:
#   - manual (workflow_dispatch)
#   - pushes to THIS branch (alpha-rive-experiment) touching the prototype
#
# NOTE: the alpha-thorvg-rect branch keeps the ThorVG build of the same file
# name; each branch's workflow builds its own variant.

on:
  workflow_dispatch:
  push:
    branches:
      - alpha-rive-experiment
    paths:
      - 'prototype/**'
      - '.github/workflows/build-inkalpha.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Rive REQUIRES exactly NDK r27c = 27.2.12479018 — a HARD error in
      # rive_build_config.lua. The ubuntu-24.04 runner image preinstalls
      # NDK 27.3/28.2/29.x but NOT r27c, and has no sdkmanager on PATH, so
      # we fetch the r27c zip straight from dl.google.com when it's missing.
      # build-tools + platforms are preinstalled on the image.
      - name: Ensure NDK r27c (Rive pin)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK root: $SDK"
          echo "build-tools: $(ls -d "$SDK"/build-tools/*/ 2>/dev/null | xargs -n1 basename | sort -V | tr '\n' ' ')"
          echo "platforms:   $(ls -d "$SDK"/platforms/android-*/ 2>/dev/null | xargs -n1 basename | sort -V | tr '\n' ' ')"
          echo "ndk:         $(ls -d "$SDK"/ndk/*/ 2>/dev/null | xargs -n1 basename | sort -V | tr '\n' ' ')"
          if [ -d "$SDK/ndk/27.2.12479018" ]; then
            echo "NDK r27c already present."
          else
            echo "NDK r27c missing — downloading (~600MB)..."
            mkdir -p "$SDK/ndk" /tmp/ndk-r27c
            curl -fsSL -o /tmp/ndk-r27c.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
            unzip -q /tmp/ndk-r27c.zip -d /tmp/ndk-r27c
            SRC="$(find /tmp/ndk-r27c -maxdepth 2 -name source.properties -exec dirname {} \; | head -1)"
            test -n "$SRC"
            mv "$SRC" "$SDK/ndk/27.2.12479018"
            echo "Installed NDK at $SDK/ndk/27.2.12479018"
          fi
          grep -h 'Pkg.Revision' "$SDK/ndk/27.2.12479018/source.properties"

      - name: Build InkAlpha APK (Rive Vulkan)
        run: bash prototype/scripts/build_prototype_rive.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inkalpha-debug-apk
          path: prototype/build/inkalpha-debug.apk