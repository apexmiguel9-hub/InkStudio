name: build-inkalpha

# Builds the InkAlpha prototype APK (ThorVG GL canvas + ported Inkscape
# rect tool) — see prototype/README.md.
#
# Triggers:
#   - manual (workflow_dispatch)
#   - pushes to the alpha branch touching the prototype

on:
  workflow_dispatch:
  push:
    branches:
      - alpha-thorvg-rect
    paths:
      - 'prototype/**'
      - '.github/workflows/build-inkalpha.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK)
        run: |
          sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: meson + ninja
        run: python3 -m pip install --user meson ninja

      - name: Build InkAlpha APK
        run: bash prototype/scripts/build_prototype.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inkalpha-debug-apk
          path: prototype/build/inkalpha-debug.apk