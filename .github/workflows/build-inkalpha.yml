name: build-inkalpha

# Builds the InkAlpha prototype APK — RIVE EXPERIMENT branch:
# Rive low-level Vulkan renderer (rive::Renderer + RenderPath over an
# ANativeWindow swapchain) + ported Inkscape rect/select tools.
# See prototype/README.md.
#
# Triggers:
#   - manual (workflow_dispatch)
#   - pushes to THIS branch (alpha-rive-experiment) touching the prototype
#
# NOTE: the alpha-thorvg-rect branch keeps the ThorVG build of the same file
# name; each branch's workflow builds its own variant.

on:
  workflow_dispatch:
  push:
    branches:
      - alpha-rive-experiment
    paths:
      - 'prototype/**'
      - '.github/workflows/build-inkalpha.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image preinstalls the Android SDK (build-tools,
      # platforms, NDK) at $ANDROID_HOME. sdkmanager is only a best-effort
      # safety net for missing pieces (setup-android@v3 is broken on current
      # cmdline-tools: its internal `sdkmanager --licenses` exits 1).
      # Rive REQUIRES exactly NDK r27c = 27.2.12479018.
      - name: Fill missing SDK bits (best-effort)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK root: $SDK"
          ls "$SDK/build-tools" 2>/dev/null; ls "$SDK/platforms" 2>/dev/null; ls "$SDK/ndk" 2>/dev/null
          need=""
          [ -d "$SDK/build-tools" ] || need="$need build-tools;35.0.0"
          [ -d "$SDK/platforms" ] || need="$need platforms;android-35"
          [ -d "$SDK/ndk/27.2.12479018" ] || need="$need ndk;27.2.12479018"
          if [ -n "$need" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            yes | sdkmanager --install $need || echo "sdkmanager failed; relying on preinstalled bits"
          fi

      - name: Build InkAlpha APK (Rive Vulkan)
        run: bash prototype/scripts/build_prototype_rive.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inkalpha-debug-apk
          path: prototype/build/inkalpha-debug.apk