name: build-inkscape

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref de inkscape/inkscape (rama, tag o sha)'
        required: false
        default: 'master'
      ndk:
        description: 'Version del NDK (misma que lib-inkscape-android_arm64; fallback r30-beta1)'
        required: false
        default: 'r30'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del port (toolchain + scripts)
        uses: actions/checkout@v4

      # NDK: zip oficial de Google + cache propio. nttld/setup-ndk con
      # local-cache está BANNED (granja de symlinks a hostedtoolcache que
      # cuelga en otros VMs → clang "No such file"). Patrón idéntico al de
      # lib-inkscape-android_arm64 (misma key ndk-<ver>-v1).
      - name: Restore NDK cache
        id: cache-ndk
        uses: actions/cache/restore@v4
        with:
          path: ~/android-ndk-${{ inputs.ndk }}
          key: ndk-${{ inputs.ndk }}-v1

      - name: Setup NDK
        id: ndk
        run: |
          set -o pipefail
          NDK_DIR="$HOME/android-ndk-${{ inputs.ndk }}"
          CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if ! test -x "$CLANG"; then
            echo "descargando android-ndk-${{ inputs.ndk }}-linux.zip ..."
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk }}-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi
          test -x "$CLANG" || { echo "ERROR: clang no ejecutable en $CLANG"; exit 1; }
          "$CLANG" --version | head -1
          # run #4: ubuntu-latest exporta ANDROID_NDK_HOME a su NDK 27.3
          # preinstalado (/usr/local/lib/android/sdk/ndk/...) y el toolchain
          # lo consulta ANTES que el glob $HOME/android-ndk-* => el configure
          # usó el 27.x del runner aunque nuestro r30 estuviera en disco
          # (cache hit). Reapuntamos la variable a NUESTRO NDK pinneado.
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR (exportado al resto del job)"

      - name: Save NDK cache
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/android-ndk-${{ inputs.ndk }}
          key: ndk-${{ inputs.ndk }}-v1

      - name: Host tools
        run: |
          sudo apt-get update
          # cmake 3.28 (Inkscape exige >= 3.24), ninja, pkg-config, gettext
          # (por si se reactiva NLS en el futuro), git-lfs para el pull
          # dirigido. NO hace falta meson: Inkscape es CMake puro y todas las
          # deps vienen pre-compiladas de las otras dos repos.
          # (pod2man no hace falta: Pod2man.cmake degrada elegante.)
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config gettext git-lfs ca-certificates
          cmake --version | head -1
          ninja --version

      # ------------------------------------------------------------------
      # Árbol de dependencias = 2 clones en CI (0 duplicación de GB,
      # 0 cuota LFS en nuestra cuenta, sin fusionar repos).
      # ------------------------------------------------------------------
      - name: Libs oficiales de Blender (LFS subset dirigido)
        run: |
          set -o pipefail
          # SKIP_SMUDGE: sin él clonamos gigas de punteros; después pull
          # dirigido de los 13 dirs que consume Inkscape (los .pc que Blender
          # no incluye los genera gen-pc.sh más abajo).
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
            https://projects.blender.org/blender/lib-android_arm64.git .blender-libs
          cd .blender-libs
          git lfs pull -I "zlib/**,png/**,jpeg/**,webp/**,openjpeg/**,freetype/**,harfbuzz/**,fribidi/**,xml2/**,epoxy/**,potrace/**,zstd/**,brotli/**"
          # Puerta LFS: la cabecera debe ser '!<arch>' (archivo real), no un
          # puntero de texto de git-lfs. OJO: son 6 bytes exactos — en el
          # intento 1 usé head -c 5 => '!<arc' que jamás matchea '!<arch>'.
          for f in zlib/lib/libz.a png/lib/libpng16.a freetype/lib/libfreetype.a \
                   harfbuzz/lib/libharfbuzz.a xml2/lib/libxml2.a \
                   potrace/lib/libpotrace.a epoxy/lib/libepoxy.a \
                   brotli/lib/libbrotlidec-static.a; do
            [ -f "$f" ] || { echo "ERROR: falta $f (¿pull LFS incompleto?)"; exit 1; }
            [ "$(head -c 6 "$f")" = '!<arch' ] \
              || { echo "ERROR: $f no es un .a real: $(head -c60 "$f")"; exit 1; }
          done
          echo "OK: subset Blender verificado ($(du -sh . | cut -f1))"

      - name: Nuestras libs (tier1 + tier2, GTK4 + gtkmm incluidos)
        run: |
          git clone --depth 1 \
            https://github.com/apexmiguel9-hub/lib-inkscape-android_arm64.git .libs
          # Puertas de cosecha de las piezas críticas del tier2
          test -f .libs/gtk4/lib/libgtk-4.so
          test -f .libs/gtkmm/lib/libgtkmm-4.0.a
          for pc in gtk4/lib/pkgconfig/gtk4.pc \
                    gtk4/lib/pkgconfig/gtk4-unix-print.pc \
                    gtkmm/lib/pkgconfig/gtkmm-4.0.pc \
                    glib/lib/pkgconfig/gmodule-2.0.pc \
                    bdw-gc/lib/pkgconfig/bdw-gc.pc \
                    lcms2/lib/pkgconfig/lcms2.pc \
                    icu/lib/pkgconfig/icu-uc.pc; do
            test -f ".libs/$pc" || { echo "ERROR: falta .libs/$pc"; exit 1; }
          done
          echo "OK: harvest crítica ($(find .libs -type d -path '*/lib/pkgconfig' | wc -l) dirs pkgconfig)"

      # La fuente viva es gitlab.com/inkscape/inkscape (master = 2882d84,
      # 2026-09-21, con .gitmodules real). github.com/inkscape/inkscape está
      # STALE desde 2022-03-03 y ni siquiera trae src/3rdparty/ ni
      # .gitmodules => run #2: los 4 pathspecs de submodule fallaron con
      # "did not match any file(s) known to git". actions/checkout sólo sabe
      # clonar de GitHub, así que aquí va un git clone directo a gitlab.
      - name: Inkscape (clone desde gitlab, la fuente viva)
        run: |
          set -o pipefail
          REF="${{ inputs.ref }}"
          # rama o tag: clone shallow directo (lo normal y rápido)
          if ! git clone --depth 1 --branch "$REF" \
                 https://gitlab.com/inkscape/inkscape.git inkscape 2>/dev/null; then
            # sha concreto: no se puede --branch un sha => clone blobless
            # (--filter=blob:none: historia completa, blobs on-demand) y checkout
            rm -rf inkscape
            git clone --filter=blob:none https://gitlab.com/inkscape/inkscape.git inkscape
          fi
          cd inkscape
          git checkout "$REF" 2>/dev/null || true   # el --branch ya lo dejó en el ref
          echo "Inkscape = $(git log -1 --format='%h %ad %s' --date=short)"
          test -f .gitmodules || { echo "ERROR: sin .gitmodules (¿ref equivocado?)"; exit 1; }
          grep -q 'src/3rdparty/2geom' .gitmodules \
            || { echo "ERROR: .gitmodules sin 2geom"; exit 1; }

      - name: Submodules de build (copias internas con fallback)
        run: |
          cd inkscape
          # Sólo los que el CMake usa como copias internas o add_subdirectory:
          #  - 2geom: find_package(2Geom QUIET) sin sistema → fallback internal
          #  - libcroco: SIEMPRE internal (no hay option)
          #  - libdepixelize / libuemf: mismo fallback que 2geom
          #  - share/themes: run #4 demostró que share/CMakeLists.txt:68 hace
          #    add_subdirectory(themes) INCONDICIONAL (mi auditoría previa decía
          #    "sólo install(DIRECTORY)" y era FALSO => "does not contain a
          #    CMakeLists.txt"). Su CMakeLists sólo tiene un install(DIRECTORY)
          #    pero el dir debe existir en configure.
          # NO po: con -DWITH_NLS=OFF => set(ENABLE_NLS OFF) => if(ENABLE_NLS)
          #       salta add_subdirectory(po) — la run #4 pasó de largo de po,
          #       confirmado empíricamente (el translations es enorme)
          # NO share/extensions: SÓLO install(DIRECTORY ...) (share/CMakeLists:21),
          #       ni un add_subdirectory => no hace falta hasta el paso install
          #       (al empaquetar el APK sí lo necesitaremos)
          # NO capypdf: -DWITH_CAPYPDF=OFF => if(WITH_CAPYPDF AND ...) no entra
          #       (la run #4 procesó src/ entero sin quejarse => confirmado)
          # (adaptagrams y autotrace van VENDORED en el propio git de Inkscape)
          git submodule update --init --depth 1 \
            src/3rdparty/2geom src/3rdparty/libcroco \
            src/3rdparty/libdepixelize src/3rdparty/libuemf share/themes
          # gates: cada dir que el configure va a leer debe tener contenido
          for p in src/3rdparty/2geom src/3rdparty/libcroco \
                   src/3rdparty/libdepixelize src/3rdparty/libuemf \
                   share/themes; do
            [ -n "$(ls -A "$p" 2>/dev/null)" ] \
              || { echo "ERROR: submodule $p vacío o ausente"; exit 1; }
          done
          test -f share/themes/CMakeLists.txt \
            || { echo "ERROR: falta share/themes/CMakeLists.txt"; exit 1; }
          echo "OK: 5 submodules inicializados (2geom/libcroco/libdepixelize/libuemf/themes)"

      # Runs #5/#6: bug upstream en src/CMakeLists.txt:339 — el generator
      # expression $<$<BOOL:WITH_CAPYPDF>:Inkscape::CapyPDF> trata WITH_CAPYPDF
      # como STRING LITERAL (las genexps NO expanden variables) y
      # $<BOOL:<cualquier-string-no-falso>> = 1 => el link al target se exige
      # SIEMPRE, pero el target sólo se crea dentro de if(WITH_CAPYPDF)
      # (DefineDependsandFlags.cmake:195) => con -DWITH_CAPYPDF=OFF el generate
      # muere con "Target ... links to but the target was not found"
      # (único $<BOOL:VAR> literal de TODO el árbol — barido completo — el resto
      # de opciones OFF no lo sufren). Parche al clone efímero: ${...} SÍ se
      # expande al parsear el comando => $<BOOL:OFF> = 0 y no se exige el target.
      - name: Parche upstream (bug genexp CapyPDF, run #5/#6)
        run: |
          set -euo pipefail
          cd inkscape
          sed -i 's|BOOL:WITH_CAPYPDF>|BOOL:${WITH_CAPYPDF}>|' src/CMakeLists.txt
          grep -qF '$<$<BOOL:${WITH_CAPYPDF}>:Inkscape::CapyPDF>' src/CMakeLists.txt \
            || { echo "ERROR: el parche CapyPDF no aplicó (¿cambió upstream la línea?)"; exit 1; }
          if grep -q 'BOOL:WITH_CAPYPDF>' src/CMakeLists.txt; then
            echo "ERROR: queda el literal BOOL:WITH_CAPYPDF> sin parchear"
            exit 1
          fi
          echo 'OK: genexp CapyPDF ahora usa ${WITH_CAPYPDF} (se expande en configure)'

      - name: pc overlay (shims Blender) + normalización .pc de .libs
        run: |
          set -euo pipefail
          bash .libs/scripts/gen-pc.sh "$PWD/.blender-libs" "$PWD/pc-overlay"
          # Runs #5/#6: el harvest de las libs dejó .pc con rutas ABSOLUTAS del
          # CI donde se construyeron (raíz: build.sh normalizaba '^prefix=' y no
          # matchea 'prefix = ' con espacios — icu; además gsl.pc lleva rutas
          # absolutas incrustadas hasta en Libs/Cflags, sin derivar de ${prefix}).
          # pkg-config --exists NO valida rutas (el pre-flight de #5 pasó) pero
          # el generate de CMake SÍ: "Imported target PkgConfig::ICU_UC includes
          # non-existent path .../.work/staging/icu/include" ×2 => run #5.
          # Regla: cualquier /home/runner/.../staging/<name> del propio .pc pasa
          # a resolverse contra pcfiledir (pc viven en <name>/lib/pkgconfig):
          #   .../staging/<name>/resto -> ${pcfiledir}/../../resto
          #   .../staging/<name>       -> ${pcfiledir}/../..
          for pc in $(grep -rl '/home/runner' .libs --include='*.pc' 2>/dev/null || true); do
            sed -i -E \
              -e 's|/home/runner[^[:space:]]*/staging/([[:alnum:]_.+-]+)/|\${pcfiledir}/../../|g' \
              -e 's|/home/runner[^[:space:]]*/staging/([[:alnum:]_.+-]+)|\${pcfiledir}/../..|g' \
              "$pc"
            echo "  normalizado: $pc"
          done
          # gate: en .libs (artefactos COMMITEADOS de la CI de las libs) ni un
          # absoluto del runner => cualquier /home/runner ahí es de OTRA máquina
          # = stale. Exento pc-overlay: gen-pc.sh:22 emite prefix=$B/$sub con la
          # ruta ABSOLUTA DEL RUN ACTUAL ($PWD/.blender-libs, tirado del LFS antes)
          # y se regenera en CADA run => válido por diseño (política: absoluto
          # calculado a runtime); su validez la exige el pre-flight de -I/-L.
          if grep -rl '/home/runner' .libs --include='*.pc' 2>/dev/null; then
            echo "ERROR: quedan .pc de .libs con rutas absolutas del runner (listados arriba)"
            exit 1
          fi
          echo "OK: .pc de .libs relocatables (0 rutas absolutas del runner)"

      - name: Entorno (PKG_CONFIG_LIBDIR + CMAKE_PREFIX_PATH) + pre-flight pkg-config
        run: |
          set -euo pipefail
          # --- pkg-config: overlay (15 shims) + pcs reales de nuestra repo ---
          PC="$(realpath pc-overlay)"
          for d in $(find "$PWD/.libs" -type d -path '*/lib/pkgconfig' | sort); do
            PC="$PC:$(realpath "$d")"
          done
          {
            echo "PKG_CONFIG_LIBDIR=$PC"
            echo "PKG_CONFIG_PATH="
            echo "PKG_CONFIG_SYSROOT_DIR="
          } >> "$GITHUB_ENV"
          export PKG_CONFIG_LIBDIR="$PC"
          # --- prefijos CMake = raíces con lib/ o include/ de ambos árboles ---
          PFX=""
          for d in "$PWD"/.libs/* "$PWD"/.blender-libs/*; do
            if [ -d "$d/lib" ] || [ -d "$d/include" ]; then
              PFX="${PFX:+$PFX:}$(realpath "$d")"
            fi
          done
          echo "CMAKE_PREFIX_PATH=$PFX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$PC"
          echo "CMAKE_PREFIX_PATH=$PFX"
          # --- pre-flight: TODOS los módulos pkg-config REQUIRED que pide ---
          # DefineDependsandFlags.cmake (INKSCAPE_DEP + MM + icu + sigc++ +
          # epoxy + gtk/glibmm/gtkmm). Fallar AQUÍ es 10x más legible que
          # fallar dentro de un pkg_check_modules de cmake.
          for m in harfbuzz pangocairo pangoft2 fontconfig gmodule-2.0 bdw-gc \
                   lcms2 icu-uc cairomm-1.16 pangomm-2.48 gdk-pixbuf-2.0 \
                   graphene-1.0 glibmm-2.68 giomm-2.68 sigc++-3.0 epoxy; do
            pkg-config --exists "$m" \
              || { echo "ERROR: pkg-config no ve '$m'"; \
                   pkg-config --print-errors --exists "$m"; exit 1; }
          done
          # pins de versión que Inkscape comprueba explícitamente
          pkg-config --exists 'harfbuzz >= 2.6.5'
          pkg-config --exists 'pangocairo >= 1.44'
          pkg-config --exists 'gtk4 >= 4.14.0'
          pkg-config --exists 'gtkmm-4.0 >= 4.13.3'
          pkg-config --exists 'glibmm-2.68 >= 2.78.1'
          pkg-config --exists 'sigc++-3.0 >= 3.6'
          echo "OK: los 17 módulos + 6 version pins de Inkscape resuelven"
          # Runs #5/#6: --exists NO valida rutas => un .pc con prefix absoluto
          # roto pasa este pre-flight y sólo estalla en el generate de CMake
          # ("ICU_UC includes non-existent path"). Ahora verificamos que TODOS
          # los -I/-L que resuelvan apuntan a dirs reales.
          for m in harfbuzz pangocairo pangoft2 fontconfig gmodule-2.0 bdw-gc \
                   lcms2 icu-uc cairomm-1.16 pangomm-2.48 gdk-pixbuf-2.0 \
                   graphene-1.0 glibmm-2.68 giomm-2.68 sigc++-3.0 epoxy \
                   gtk4 gtkmm-4.0; do
            for d in $(pkg-config --cflags "$m" | tr ' ' '\n' | sed -n 's/^-I//p') \
                     $(pkg-config --libs "$m"   | tr ' ' '\n' | sed -n 's/^-L//p'); do
              [ -d "$d" ] || {
                echo "ERROR: $m -> dir '$d' no existe (¿.pc con ruta absoluta rota?)"
                exit 1
              }
            done
          done
          echo "OK: dirs -I/-L resueltos existen (19 módulos)"

      # Runs #3 y #4: find_package(Boost 1.19.0 REQUIRED) (DefineDepends:371).
      #  - #3: ni módulo (el cmake oficial >= 3.30 ya NO trae Modules/FindBoost;
      #    sólo lo hace el de Debian) ni config (boost de Blender = headers+.a
      #    SIN BoostConfig.cmake) => "By not providing FindBoost.cmake...".
      #  - #4: con NUESTRO FindBoost.cmake en CMakeScripts/Modules el módulo SÍ
      #    se cargó (stack: Modules/FindBoost.cmake:13 (include) <- 371)
      #    => CMP0167=NEW SÓLO EXCLUYE el built-in; el módulo del usuario en
      #    CMAKE_MODULE_PATH gana la búsqueda ANTES que BoostConfig (la lectura
      #    inicial "NEW => jamás carga FindBoost" era FALSA; doc oficial +
      #    runs + test local lo confirman). Falló su include: copiamos el
      #    entry y NO el core => "include could not find boost-find-core" ×3.
      # Fix: entry y core viajan JUNTOS a Modules/ (réplica local: core al
      # lado => verde; sin core => el error exacto de la run #4). Mismo patrón
      # que gen-pc.sh: dar la capa que el consumidor exige, sin reconstruir.
      # BoostConfig+BoostConfigVersion se instalan igualmente como RED (config
      # mode) en <boost>/lib/cmake/boost-<ver>/ (versión LEÍDA del version.hpp,
      # sin hardcode) + -DBoost_DIR, por si un ref futuro no lleva el módulo.
      - name: Shims Boost (FindBoost+core en Modules gana; BoostConfig de red)
        run: |
          set -euo pipefail
          if grep -q 'CMP0167' inkscape/CMakeLists.txt; then
            echo "nota: este ref fuerza CMP0167=NEW (excluye el built-in; NUESTRO módulo en MODULE_PATH sigue ganando)"
          else
            echo "nota: este ref NO toca CMP0167 => modo módulo con el FindBoost nativo si el cmake lo trae"
          fi
          # versión real del boost harvesteado (108700 => 1.87.0), sin hardcode
          VH=.libs/boost/include/boost/version.hpp
          test -f "$VH" || { echo "ERROR: falta $VH"; exit 1; }
          V="$(sed -n 's/^#define BOOST_VERSION[[:space:]]\+\([0-9]\+\)$/\1/p' "$VH")"
          [ -n "$V" ] || { echo "ERROR: BOOST_VERSION ilegible en $VH"; exit 1; }
          MAJ=$((V / 100000)); MIN=$(( (V / 100) % 100 )); PAT=$((V % 100))
          D="$PWD/.libs/boost/lib/cmake/boost-${MAJ}.${MIN}.${PAT}"
          mkdir -p "$D"
          cp scripts/cmake/BoostConfig.cmake \
             scripts/cmake/BoostConfigVersion.cmake \
             scripts/cmake/boost-find-core.cmake "$D/"
          for f in BoostConfig.cmake BoostConfigVersion.cmake boost-find-core.cmake; do
            test -f "$D/$f" || { echo "ERROR: no se copió $D/$f"; exit 1; }
          done
          echo "BoostConfig instalado en $D (boost ${MAJ}.${MIN}.${PAT})"
          # EL QUE MANDA: el módulo en MODULE_PATH (CMakeLists.txt:23).
          # Entry + core JUNTOS — el include usa CMAKE_CURRENT_LIST_DIR y sin
          # el core es exactamente el fallo de la run #4 ("include could not
          # find"). La run #4 probó que el módulo del usuario gana al config.
          grep -q 'CMAKE_MODULE_PATH.*CMakeScripts/Modules' inkscape/CMakeLists.txt \
            || { echo "ERROR: CMAKE_MODULE_PATH ya no apunta a CMakeScripts/Modules"; exit 1; }
          cp scripts/cmake/FindBoost.cmake scripts/cmake/boost-find-core.cmake \
             inkscape/CMakeScripts/Modules/
          test -f inkscape/CMakeScripts/Modules/FindBoost.cmake
          test -f inkscape/CMakeScripts/Modules/boost-find-core.cmake
          echo "FindBoost.cmake + boost-find-core.cmake instalados en CMakeScripts/Modules"

      - name: CMake configure
        id: cfg
        run: |
          set -o pipefail
          # Tier3 OFF a mano (se auto-apagarían igual si faltan, pero explícito
          # = más legible): poppler/wpg/visio/cdr (import de PDF/WMF/VSD/CDR),
          # libspelling, gtksourceview-5, ImageMagick, readline, capypdf.
          # NLS OFF => sin submodule po/ (ver paso anterior).
          cmake -S inkscape -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/scripts/android-aarch64.cmake" \
            -DCMAKE_ANDROID_NDK="$HOME/android-ndk-${{ inputs.ndk }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_POPPLER=OFF -DENABLE_POPPLER_CAIRO=OFF \
            -DWITH_LIBWPG=OFF -DWITH_LIBVISIO=OFF -DWITH_LIBCDR=OFF \
            -DWITH_LIBSPELLING=OFF -DWITH_GSOURCEVIEW=OFF \
            -DWITH_IMAGE_MAGICK=OFF -DWITH_GRAPHICS_MAGICK=OFF \
            -DWITH_GNU_READLINE=OFF -DWITH_CAPYPDF=OFF -DWITH_NLS=OFF \
            -DBOOST_ROOT="$PWD/.libs/boost" \
            -DBoost_DIR="$PWD/scripts/cmake" \
            2>&1 | tee configure.log
          # Puerta NDK (run #4: ANDROID_NDK_HOME del runner pisó nuestro r30
          # con su NDK 27.3 preinstalado). El Configuration Summary del
          # configure lista CMAKE_C_COMPILER: DEBE venir del NDK pinneado.
          grep -E "CMAKE_C_COMPILER:.*android-ndk-${{ inputs.ndk }}/" configure.log || {
            echo "ERROR: el configure NO usó el NDK pinneado ${{ inputs.ndk }}"
            grep -E 'CMAKE_C_COMPILER' configure.log || true
            exit 1
          }
          echo "OK: NDK ${{ inputs.ndk }} verificado en el configure"

      - name: CMake build
        id: bld
        run: |
          set -o pipefail
          # -k0: sigue tras el primer error → un solo log con TODAS las
          # clases de fallo (misma filosofía de diagnóstico que en las libs)
          cmake --build build -- -k0 2>&1 | tee build.log

      - name: Resumen de artefactos
        run: |
          echo "=== binarios/libs generados ==="
          find build -type f \( -name 'inkscape' -o -name 'inkscape.exe' \
             -o -name 'libink*.so' \) -exec ls -la {} \; || true

      - name: Diagnóstico (configure falló)
        if: failure() && steps.cfg.outcome == 'failure'
        run: |
          echo "=== CMake Errors ==="
          grep -rh 'CMake Error' configure.log 2>/dev/null | head -40 || true
          echo "=== CMakeError.log tail ==="
          tail -60 build/CMakeFiles/CMakeError.log 2>/dev/null || true
          echo "=== configure.log tail ==="
          tail -40 configure.log 2>/dev/null || true

      - name: Diagnóstico (build falló)
        if: failure() && steps.bld.outcome == 'failure'
        run: |
          echo "=== FAILED (ninja) ==="
          grep -a 'FAILED' build.log | sed 's/.*FAILED/FAILED/' | sort -u | head -20 || true
          echo "=== errores de compilación/enlace ==="
          grep -aE 'error:|undefined reference|ld\.lld:' build.log | sort -u | head -60 || true
          echo "=== build.log tail ==="
          tail -40 build.log 2>/dev/null || true

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkscape-logs
          path: |
            configure.log
            build.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7
